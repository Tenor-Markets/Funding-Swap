[package]
name = "fixed-perp"
version = "0.1.0"
description = "Fixed Perp Solana program"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "fixed_perp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "fixed-perp-math/anchor-idl"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.2"
anchor-spl = { version = "=1.0.2", features = ["token"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
fixed = { version = "=1.28.0", default-features = false }
fixed-perp-error = { path = "../../crates/fixed-perp-error" }
fixed-perp-adapters = { path = "../../crates/fixed-perp-adapters" }
fixed-perp-math = { path = "../../crates/fixed-perp-math" }
pyth-solana-receiver-sdk = "2.0.0"

[dev-dependencies]
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
