[package]
name = "fixed-perp-math"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.89"

[features]
anchor-idl = ["dep:anchor-lang", "anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.0.2", optional = true }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
fixed = { version = "=1.28.0", default-features = false }

[dev-dependencies]
num-bigint = "0.4"
num-traits = "0.2"
proptest = "1"
